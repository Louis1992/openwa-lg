name: LG Image (markonline-fix)

# Minimal single-arch (linux/amd64 — the target Hetzner server) image build for the LeadGenies
# OpenWA gateway. Bypasses the heavy upstream CI (lint/test/multi-arch): the only gate we need is
# that the TypeScript compiles, which the Dockerfile's `npm run build` enforces. Pushes to GHCR so
# Coolify can pull it.

on:
  push:
    branches: [markonline-fix]
  workflow_dispatch:

jobs:
  image:
    name: Build & push amd64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/louis1992/openwa-lg:markonline-fix
          provenance: false
